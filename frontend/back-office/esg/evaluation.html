<body>
  <header class="site-header">
    <div class="container-wide">
      <a href="my-hackathons.html" class="site-header__logo">EnterpriseSG <span>Challenge Console</span><small>Demand Driver &amp; EnterpriseSG workspace</small></a>
      <div class="site-header__right">
        <nav class="site-nav"><a href="my-hackathons.html">Control Panel</a></nav><div class="site-header__actions"><a href="demand-driver-management.html">Demand Drivers</a><a href="notifications.html">Notifications</a><a href="account.html">Account</a><a href="../login.html" class="btn btn-secondary">Log Out</a></div>
      </div>
    </div>
  </header>
  
  <main>
    <section class="content-section">
      <div class="container">
        <h2>Evaluation</h2>
        <p class="text-muted">Optional feature (RFQ 1.d.iv) - scoring Portside Analytics' CS1 submission.</p>
        <form>
          <div class="form-field"><label>Feasibility (0-10)</label><input type="number" min="0" max="10" value="7" /></div>
          <div class="form-field"><label>Impact on Meridian's operations (0-10)</label><input type="number" min="0" max="10" value="8" /></div>
          <div class="form-field"><label>Innovation (0-10)</label><input type="number" min="0" max="10" value="6" /></div>
          <div class="form-field"><label>Team capability (0-10)</label><input type="number" min="0" max="10" value="7" /></div>
          <div class="form-field"><label>Comments</label><textarea rows="4" placeholder="Notes for the judging panel..."></textarea></div>
          <div class="form-actions"><button type="button" class="btn btn-primary">Submit Score</button></div>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container-wide">
      <div>EnterpriseSG Challenge Console &middot; internal use only</div>
      <div class="footer-links"><a href="../../client-facing/public/index.html">View public site</a></div>
    </div>
  </footer>
  <script src="../../../shared/scripts/app.js"></script>
